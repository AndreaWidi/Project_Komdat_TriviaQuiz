<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Diagram Alir - Trivia Quiz Multiplayer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 24px;
  }
  h1 {
    text-align: center;
    color: #60a5fa;
    font-size: 22px;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-bottom: 32px;
  }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .tab {
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab.active {
    background: #2563eb;
    border-color: #2563eb;
    color: white;
  }
  .diagram { display: none; }
  .diagram.active { display: block; }

  /* ─── SVG STYLES ─── */
  svg { width: 100%; overflow: visible; }

  /* Box styles */
  .box-start    { fill: #1e40af; stroke: #3b82f6; stroke-width: 2; rx: 20; }
  .box-end      { fill: #7f1d1d; stroke: #ef4444; stroke-width: 2; rx: 20; }
  .box-process  { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 8; }
  .box-decision { fill: #1c1917; stroke: #78716c; stroke-width: 1.5; }
  .box-io       { fill: #14532d; stroke: #22c55e; stroke-width: 1.5; rx: 4; }
  .box-server   { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
  .box-client   { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; rx: 8; }

  text { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #e2e8f0; }
  text.bold { font-weight: 600; }
  text.small { font-size: 10px; fill: #94a3b8; }
  text.label { font-size: 10px; fill: #fbbf24; }

  line, path { stroke: #475569; stroke-width: 1.5; fill: none; }
  .arrow-blue { stroke: #3b82f6; }
  .arrow-green { stroke: #22c55e; }
  .arrow-red { stroke: #ef4444; }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 24px;
    margin-top: 20px;
    font-size: 12px;
    color: #94a3b8;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-box { width: 16px; height: 14px; border-radius: 3px; border: 1px solid; }
</style>
</head>
<body>

<h1>🎯 Diagram Alir — Trivia Quiz Multiplayer</h1>
<p class="subtitle">Komunikasi Data 2026 | Protokol TCP/IP</p>

<div class="tabs">
  <button class="tab active" onclick="showTab('server')">Server</button>
  <button class="tab" onclick="showTab('client')">Client</button>
  <button class="tab" onclick="showTab('game')">Alur Game</button>
  <button class="tab" onclick="showTab('protokol')">Protokol TCP</button>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     TAB 1: SERVER FLOWCHART
════════════════════════════════════════════════════════════════════════ -->
<div id="tab-server" class="diagram active">
<svg viewBox="0 0 700 820" height="820">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- START -->
  <rect x="250" y="20" width="200" height="40" rx="20" class="box-start"/>
  <text x="350" y="45" text-anchor="middle" class="bold">MULAI SERVER</text>

  <!-- Bind socket -->
  <rect x="220" y="90" width="260" height="44" rx="8" class="box-server"/>
  <text x="350" y="108" text-anchor="middle" class="bold">Buat Socket TCP</text>
  <text x="350" y="126" text-anchor="middle" class="small">bind(HOST:5555) → listen()</text>

  <!-- Tunggu koneksi -->
  <rect x="220" y="164" width="260" height="44" rx="8" class="box-process"/>
  <text x="350" y="182" text-anchor="middle" class="bold">Tunggu Koneksi Client</text>
  <text x="350" y="200" text-anchor="middle" class="small">accept() — blocking</text>

  <!-- Thread baru -->
  <rect x="220" y="238" width="260" height="44" rx="8" class="box-server"/>
  <text x="350" y="256" text-anchor="middle" class="bold">Spawn Thread Baru</text>
  <text x="350" y="274" text-anchor="middle" class="small">handle_client(conn, addr)</text>

  <!-- Loop balik ke tunggu -->
  <line x1="350" y1="282" x2="350" y2="310" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="140" y1="310" x2="140" y2="186" stroke="#475569"/>
  <line x1="140" y1="186" x2="220" y2="186" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="310" x2="140" y2="310" stroke="#475569"/>
  <text x="100" y="255" class="label" transform="rotate(-90,100,255)">Loop</text>

  <!-- Terima GABUNG -->
  <rect x="220" y="320" width="260" height="44" rx="8" class="box-io"/>
  <text x="350" y="338" text-anchor="middle" class="bold">Terima Pesan GABUNG</text>
  <text x="350" y="356" text-anchor="middle" class="small">nama pemain dari client</text>

  <!-- Cek penuh? -->
  <polygon points="350,390 460,420 350,450 240,420" class="box-decision" style="fill:#1c1917;stroke:#78716c;stroke-width:1.5"/>
  <text x="350" y="417" text-anchor="middle" class="bold">Server Penuh?</text>
  <text x="350" y="432" text-anchor="middle" class="small">(≥ 4 pemain)</text>

  <!-- Ya → tolak -->
  <line x1="460" y1="420" x2="540" y2="420" marker-end="url(#arr-r)" class="arrow-red"/>
  <rect x="542" y="400" width="130" height="40" rx="8" style="fill:#450a0a;stroke:#ef4444;stroke-width:1.5"/>
  <text x="607" y="415" text-anchor="middle" class="small">Kirim ERROR</text>
  <text x="607" y="430" text-anchor="middle" class="small">"Server penuh"</text>
  <text x="475" y="414" class="label">Ya</text>

  <!-- Tidak → simpan -->
  <line x1="350" y1="450" x2="350" y2="476" marker-end="url(#arr-g)" class="arrow-green"/>
  <text x="358" y="468" class="label">Tidak</text>

  <!-- Simpan client -->
  <rect x="220" y="478" width="260" height="44" rx="8" class="box-server"/>
  <text x="350" y="496" text-anchor="middle" class="bold">Simpan ke clients{}</text>
  <text x="350" y="514" text-anchor="middle" class="small">nama, skor=0, sudah_jawab=False</text>

  <!-- Broadcast -->
  <rect x="220" y="552" width="260" height="44" rx="8" class="box-io"/>
  <text x="350" y="570" text-anchor="middle" class="bold">Broadcast PEMAIN_LIST</text>
  <text x="350" y="588" text-anchor="middle" class="small">ke semua client</text>

  <!-- Terima pesan loop -->
  <rect x="220" y="626" width="260" height="44" rx="8" class="box-process"/>
  <text x="350" y="644" text-anchor="middle" class="bold">Loop: Terima Pesan</text>
  <text x="350" y="662" text-anchor="middle" class="small">MULAI | JAWAB | CHAT</text>

  <!-- Proses -->
  <rect x="220" y="700" width="260" height="44" rx="8" class="box-server"/>
  <text x="350" y="718" text-anchor="middle" class="bold">Proses & Broadcast</text>
  <text x="350" y="736" text-anchor="middle" class="small">sesuai tipe pesan</text>

  <!-- Loop balik -->
  <line x1="480" y1="722" x2="520" y2="722" stroke="#475569"/>
  <line x1="520" y1="722" x2="520" y2="648" stroke="#475569"/>
  <line x1="520" y1="648" x2="480" y2="648" marker-end="url(#arr)" stroke="#475569"/>

  <!-- Arrows -->
  <line x1="350" y1="60" x2="350" y2="90" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="134" x2="350" y2="164" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="208" x2="350" y2="238" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="364" x2="350" y2="390" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="522" x2="350" y2="552" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="596" x2="350" y2="626" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="670" x2="350" y2="700" marker-end="url(#arr)" stroke="#475569"/>
</svg>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     TAB 2: CLIENT FLOWCHART
════════════════════════════════════════════════════════════════════════ -->
<div id="tab-client" class="diagram">
<svg viewBox="0 0 700 780" height="780">
  <!-- START -->
  <rect x="250" y="20" width="200" height="40" rx="20" class="box-start"/>
  <text x="350" y="45" text-anchor="middle" class="bold">MULAI CLIENT</text>

  <!-- Input nama -->
  <rect x="220" y="90" width="260" height="44" rx="8" class="box-io"/>
  <text x="350" y="108" text-anchor="middle" class="bold">Input Nama Pemain</text>
  <text x="350" y="126" text-anchor="middle" class="small">dari terminal / browser</text>

  <!-- Connect -->
  <rect x="220" y="164" width="260" height="44" rx="8" class="box-client"/>
  <text x="350" y="182" text-anchor="middle" class="bold">Buat Koneksi TCP</text>
  <text x="350" y="200" text-anchor="middle" class="small">connect(HOST, 5555)</text>

  <!-- Berhasil? -->
  <polygon points="350,234 450,260 350,286 250,260" style="fill:#1c1917;stroke:#78716c;stroke-width:1.5"/>

  <!-- Thread recv -->

  <!-- Input loop -->
  <rect x="220" y="466" width="260" height="44" rx="8" class="box-process"/>

  <!-- Cek tipe input -->
  <polygon points="350,526 460,556 350,586 240,556" style="fill:#1c1917;stroke:#78716c;stroke-width:1.5"/>
  <text x="350" y="549" text-anchor="middle" class="bold">Tipe Input?</text>
  <text x="350" y="566" text-anchor="middle" class="small">periksa perintah</text>

  <!-- Cabang-cabang -->
  <!-- mulai -->
  <line x1="240" y1="556" x2="140" y2="556" stroke="#475569"/>
  <line x1="140" y1="556" x2="140" y2="630" stroke="#475569"/>
  <rect x="60" y="612" width="120" height="36" rx="6" class="box-io"/>

  <text x="175" y="549" class="label" style="fill:#fbbf24">mulai</text>

  <!-- jawaban -->
  <line x1="350" y1="586" x2="350" y2="622" marker-end="url(#arr)" stroke="#475569"/>
  <rect x="230" y="624" width="240" height="36" rx="6" class="box-io"/>
  <text x="350" y="638" text-anchor="middle" class="small" style="fill:#e2e8f0">Kirim JAWAB</text>

  <text x="358" y="612" class="label">A/B/C/D</text>

  <!-- chat -->
  <line x1="460" y1="556" x2="560" y2="556" stroke="#475569"/>
  <line x1="560" y1="556" x2="560" y2="630" stroke="#475569"/>
  <rect x="500" y="612" width="120" height="36" rx="6" class="box-io"/>
  <text x="560" y="626" text-anchor="middle" class="small" style="fill:#e2e8f0">Kirim CHAT</text>

  <!-- keluar -->
  <line x1="350" y1="660" x2="350" y2="690" marker-end="url(#arr)" stroke="#ef4444" class="arrow-red"/>

  <!-- Loop balik -->
  <line x1="140" y1="648" x2="140" y2="488" stroke="#475569"/>
  <line x1="140" y1="488" x2="220" y2="488" marker-end="url(#arr)" stroke="#475569"/>

  <line x1="350" y1="60" x2="350" y2="90" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="134" x2="350" y2="164" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="208" x2="350" y2="234" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="362" x2="350" y2="392" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="436" x2="350" y2="466" marker-end="url(#arr)" stroke="#475569"/>
  <line x1="350" y1="510" x2="350" y2="526" marker-end="url(#arr)" stroke="#475569"/>
</svg>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     TAB 3: ALUR GAME
════════════════════════════════════════════════════════════════════════ -->
<div id="tab-game" class="diagram">

  <rect x="280" y="10" width="200" height="34" rx="6" style="fill:#1e3a5f;stroke:#3b82f6;stroke-width:1.5"/>
  <text x="380" y="32" text-anchor="middle" class="bold" style="fill:#93c5fd">SERVER</text>

  <rect x="530" y="10" width="200" height="34" rx="6" style="fill:#312e81;stroke:#818cf8;stroke-width:1.5"/>
  <text x="630" y="32" text-anchor="middle" class="bold" style="fill:#a5b4fc">CLIENT 2</text>

  <!-- Garis vertikal -->

  <text x="500" y="198" class="small">Daftar ke server</text>

  <rect x="80" y="208" width="540" height="28" rx="0" style="fill:#1e293b"/>
  <text x="100" y="226" class="small" style="fill:#86efac">MULAI</text>

  <text x="500" y="416" class="small">Update daftar pemain</text>

  <text x="120" y="658" class="small">✅  Handshake memastikan koneksi valid sebelum game dimulai</text>
